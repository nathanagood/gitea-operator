name: Go Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # You can test your matrix by printing the current Go version
      - name: Display Go version
        run: go version
      - name: Build it
        run: make V=1
      - name: Test
        run: make test
      - name: Lint
        run: make lint
