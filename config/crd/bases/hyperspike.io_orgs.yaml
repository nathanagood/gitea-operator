---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: orgs.hyperspike.io
spec:
  group: hyperspike.io
  names:
    kind: Org
    listKind: OrgList
    plural: orgs
    singular: org
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Gitea Name
      type: string
    - jsonPath: .status.provisioned
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Org is the Schema for the orgs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OrgSpec defines the desired state of Org
            properties:
              description:
                description: A brief explanation of the organization.
                type: string
              fullname:
                description: The human readable name of the organization.
                type: string
              instance:
                description: the gitea instance to build the org in
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              location:
                description: The physical location of the org, if any
                type: string
              name:
                description: |-
                  The organization's name in Gitea, exactly as Gitea shows it (for
                  example "ITZ"). Defaults to metadata.name. Set it when the Gitea name is
                  not a valid Kubernetes name, such as one with capital letters. Only its
                  letter case can be changed once set (Gitea names are case-insensitive).
                maxLength: 40
                pattern: ^[A-Za-z0-9_.-]+$
                type: string
              teams:
                description: users list to
                items:
                  properties:
                    createOrgRepo:
                      type: boolean
                    description:
                      type: string
                    includeAllRepos:
                      type: boolean
                    memberPolicy:
                      description: |-
                        How the operator reconciles Members:
                        Exact removes anyone not listed; Additive only adds listed members and
                        leaves others; Ignore never touches membership.
                        When unset, the team is Ignore if any Auth for the same Gitea instance
                        maps a group to it in groupTeamMap (the identity provider owns its
                        membership), and Exact otherwise.
                      enum:
                      - Exact
                      - Additive
                      - Ignore
                      type: string
                    members:
                      items:
                        type: string
                      type: array
                    name:
                      type: string
                    permission:
                      description: |-
                        Team-wide access. admin and owner give admin access to every unit and
                        ignore units/unitsMap. read and write apply to every unit in `units`.
                        Unset or none means read, unless unitsMap is set.
                      enum:
                      - none
                      - read
                      - write
                      - admin
                      - owner
                      type: string
                    units:
                      description: |-
                        Repository units the team can use (repo.code, repo.issues, ...), all at
                        `permission`. Empty means every unit.
                      items:
                        type: string
                      type: array
                    unitsMap:
                      additionalProperties:
                        description: TeamUnitAccess is a team's access level for one
                          repository unit.
                        enum:
                        - none
                        - read
                        - write
                        type: string
                      description: |-
                        Access level per unit, such as {repo.code: write, repo.wiki: read}.
                        Use this for teams whose units have different levels. For read/write
                        teams it replaces `units` and `permission`.
                      type: object
                  required:
                  - name
                  type: object
                type: array
              visibility:
                description: The ACL name of the org. public, private, etc.
                type: string
              website:
                description: The url of the website associated with this org.
                type: string
            required:
            - instance
            type: object
          status:
            description: OrgStatus defines the observed state of Org
            properties:
              provisioned:
                type: boolean
            required:
            - provisioned
            type: object
        type: object
        x-kubernetes-validations:
        - message: the Gitea organization name (spec.name, or metadata.name when unset)
            cannot be changed, except for its letter case
          rule: '(has(self.spec) && has(self.spec.name) ? self.spec.name : self.metadata.name).lowerAscii()
            == (has(oldSelf.spec) && has(oldSelf.spec.name) ? oldSelf.spec.name :
            oldSelf.metadata.name).lowerAscii()'
    served: true
    storage: true
    subresources:
      status: {}
