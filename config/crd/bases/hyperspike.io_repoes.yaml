---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: repoes.hyperspike.io
spec:
  group: hyperspike.io
  names:
    kind: Repo
    listKind: RepoList
    plural: repoes
    singular: repo
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.org.name
      name: Org
      type: string
    - jsonPath: .spec.name
      name: Gitea Name
      type: string
    - jsonPath: .spec.archived
      name: Archived
      type: boolean
    - jsonPath: .status.provisioned
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Repo is the Schema for the repoes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RepoSpec defines the desired state of Repo
            properties:
              archived:
                description: |-
                  Archived makes the repository read-only in Gitea while keeping its data.
                  Setting it back to false unarchives it. Deleting the Repo resource
                  instead deletes the repository and everything in it.
                type: boolean
              auto_init:
                description: Whether the repository should be auto-intialized?
                type: boolean
              default_branch:
                description: DefaultBranch of the repository (used when initializes
                  and in template)
                type: string
              description:
                description: a brief explanation of the repo
                type: string
              gitignores:
                description: Gitignores to use
                type: string
              issue_labels:
                description: Issue Label set to use
                type: string
              license:
                description: License to use
                type: string
              name:
                description: |-
                  Name of the repository in Gitea. Defaults to metadata.name. Set it when
                  the Gitea name is not a valid Kubernetes name, or when repositories with
                  the same name exist in more than one org; by convention metadata.name is
                  then "<org>-<name>" in lowercase. Only its letter case can be changed after
                  creation (Gitea names are case-insensitive).
                maxLength: 100
                pattern: ^[A-Za-z0-9_.-]+$
                type: string
              org:
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              private:
                description: Whether the repository is private
                type: boolean
              push_mirror:
                description: Mirror settings
                properties:
                  enable:
                    description: Whether to mirror the repository
                    type: boolean
                  interval:
                    description: Interval for mirroring the repository
                    type: string
                  password:
                    description: Password for authentication
                    type: string
                  remote_url:
                    description: Remote URL for the mirror
                    type: string
                  sync_on_commit:
                    description: SyncOnCommit indicates whether to sync on every commit
                    type: boolean
                  user_name:
                    description: UserName for authentication
                    type: string
                type: object
              readme:
                description: Readme of the repository to create
                type: string
              template:
                description: Whether the repository is template
                type: boolean
              trust_model:
                description: TrustModel of the repository
                type: string
              user:
                properties:
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
            type: object
          status:
            description: RepoStatus defines the observed state of Repo
            properties:
              provisioned:
                description: |-
                  INSERT ADDITIONAL STATUS FIELD - define observed state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                type: boolean
            required:
            - provisioned
            type: object
        type: object
        x-kubernetes-validations:
        - message: the Gitea repository name (spec.name, or metadata.name when unset)
            cannot be changed, except for its letter case
          rule: '(has(self.spec) && has(self.spec.name) ? self.spec.name : self.metadata.name).lowerAscii()
            == (has(oldSelf.spec) && has(oldSelf.spec.name) ? oldSelf.spec.name :
            oldSelf.metadata.name).lowerAscii()'
        - message: spec.org.name cannot be changed
          rule: '!has(oldSelf.spec) || !has(oldSelf.spec.org) || (has(self.spec) &&
            has(self.spec.org) && self.spec.org.name == oldSelf.spec.org.name)'
    served: true
    storage: true
    subresources:
      status: {}
